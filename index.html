<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>홀덤 테이블</title>
<meta name="description" content="텍사스 홀덤 포커. 컴퓨터와 대결하거나 초대 링크로 친구들과 온라인으로 함께 플레이.">
<meta name="theme-color" content="#0b1d19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="홀덤">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one felt table with six seats on an oval rail; your hand and controls docked beneath it. Single dark card-room look. */
:root{
  --bg:#0b1d19; --panel:#12302a; --panel-2:#183a33; --line:#2b5549;
  --felt:#11493d; --felt-hi:#1b6152; --rail:#2a1c13; --rail-hi:#4a3322;
  --ink:#f2ead8; --muted:#9fb5aa; --faint:#6f8c80;
  --brass:#dcaa4f; --brass-ink:#22180a;
  --card:#fbf6ea; --card-ink:#1c1c1c; --red:#c3312c; --back-1:#7c2a23; --back-2:#93392f;
  --ok:#6cc08a; --warn:#e2b34f; --danger:#d0574a;
  --f-display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:12px 28px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:620px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{white-space:nowrap;font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;letter-spacing:.01em;flex:1;min-width:0}
.bar h1 small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink)}
.ghost:hover{border-color:var(--brass)}

/* lobby */
.hero{padding-block:18px 6px}
.hero h2{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1.05;margin:0 0 8px;text-wrap:balance}
.hero p{color:var(--muted);margin:0;max-width:52ch}
.suits{font-size:20px;letter-spacing:.3em;color:var(--brass);margin-bottom:6px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mode h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.mode p{margin:0;color:var(--muted);font-size:14px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);font-size:18px}
.stepper .num{font-size:20px;min-width:2ch;text-align:center}
.primary{background:var(--brass);color:var(--brass-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code-in{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font-family:var(--f-num);font-size:17px;letter-spacing:.2em;text-transform:uppercase}
.note{font-size:13px;color:var(--faint);margin:0}
.note.warn{color:var(--warn)}

/* table */
.table{position:relative;width:100%;aspect-ratio:10/12.5;max-width:560px;margin-inline:auto}
.table.wide{aspect-ratio:16/9;max-width:none}
.felt{position:absolute;inset:26% 2.5% 26% 2.5%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,var(--felt-hi),var(--felt) 70%);
  box-shadow:0 0 0 9px var(--rail),0 0 0 11px var(--rail-hi),inset 0 0 40px rgba(0,0,0,.35)}
.felt::after{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(242,234,216,.08)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:56%}
.table.wide .felt{inset:14% 7%}
.table.wide .center{width:46%;gap:8px}
.board{display:flex;gap:3px;--cw:min(54px,calc((min(100vw - 32px,560px) * .55 - 12px) / 5))}
.table.wide .board{--cw:clamp(56px,4.8vw,88px);gap:6px}
.pot{display:flex;flex-direction:column;align-items:center;gap:3px;--sz:19px}
.pot .amt{font-size:13px;color:var(--ink);background:rgba(0,0,0,.32);padding:1px 12px;border-radius:999px}
.table.wide .pot{--sz:clamp(24px,2vw,32px)}
.table.wide .pot .amt{font-size:15px}
.pot b{color:var(--brass);font-weight:600}
.result{font-size:12px;line-height:1.35;text-align:center;color:var(--brass);min-height:1.4em;text-wrap:balance}
.stage{font-size:11px;letter-spacing:.14em;color:var(--muted)}

.seat{position:absolute;transform:translate(-50%,-50%);width:70px;display:flex;flex-direction:column;align-items:center;gap:3px}
.seat .hole{display:flex;gap:2px;--cw:25px;height:35px}
.table.wide .seat{width:clamp(100px,8.4vw,140px)}
.table.wide .seat .hole{--cw:clamp(36px,3vw,50px);height:calc(var(--cw)*1.4)}
.table.wide .plate{padding:6px 8px;border-radius:12px}
.table.wide .plate .nm,.table.wide .plate .ch{font-size:clamp(13px,1vw,16px)}
.table.wide .plate .st{font-size:12px}
.table.wide .plate .ch .chip{--sz:14px}
.table.wide .stage{font-size:13px}
.table.wide .result{font-size:15px}
.table.wide .sit,.table.wide .emptyseat{font-size:13px;padding:10px 6px}
.plate{position:relative;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px;text-align:center;line-height:1.25}
.plate .nm{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .ch{display:block;font-size:12px;color:var(--brass)}
.plate .st{display:block;font-size:10px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.acting .plate{border-color:var(--brass);box-shadow:0 0 0 2px rgba(220,170,79,.35)}
.seat.folded{opacity:.45}
.seat.out{opacity:.3}
.seat.win .plate{border-color:var(--ok);box-shadow:0 0 0 2px rgba(108,192,138,.35)}
.badge{position:absolute;top:-8px;right:-6px;min-width:20px;height:20px;border-radius:999px;background:var(--card);color:var(--card-ink);font-size:10px;font-weight:700;display:grid;place-items:center;padding-inline:4px;font-family:var(--f-num)}
.timer{height:3px;width:100%;background:rgba(0,0,0,.35);border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--brass);width:100%}
.betchip{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;--sz:15px;pointer-events:none}
.betchip .amt{font-size:10px;background:rgba(0,0,0,.45);color:var(--ink);border-radius:999px;padding:0 6px;white-space:nowrap}
.table.wide .betchip{--sz:clamp(18px,1.5vw,24px)}
.table.wide .betchip .amt{font-size:12px}
.sit{background:rgba(0,0,0,.25);border:1px dashed var(--brass);border-radius:10px;padding:8px 6px;width:100%;font-size:12px;color:var(--brass)}
.emptyseat{border:1px dashed rgba(242,234,216,.12);border-radius:10px;padding:8px 6px;width:100%;font-size:11px;color:var(--faint);text-align:center}

/* cards */
.card{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.09);flex:none;position:relative;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.card svg{display:block;width:100%;height:100%}
.card.empty{box-shadow:none;border:1.5px dashed rgba(242,234,216,.16)}
.card.hl{box-shadow:0 0 0 2px var(--ok),0 2px 6px rgba(0,0,0,.45)}
.card.dim{opacity:.5}
.card.new{animation:deal .32s ease-out}
@keyframes deal{from{transform:translateY(-10px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}

/* dock */
.dock{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.mine{display:flex;align-items:center;gap:14px}
.mine .hole{display:flex;gap:6px;--cw:58px}
.mine .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.mine .hand{font-family:var(--f-display);font-size:22px;line-height:1.1}
.mine .sub{font-size:13px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.act{border-radius:12px;border:1px solid var(--line);background:var(--panel-2);padding:12px 6px;font-weight:700;font-size:15px;min-height:50px}
.act.fold{color:var(--danger)}
.act.call{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act.raise{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.act:disabled{opacity:.35;cursor:not-allowed}
.raisebox{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.raisebox input[type=range]{width:100%;accent-color:var(--brass)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presets button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 2px;font-size:12px}
.status{text-align:center;color:var(--muted);font-size:14px;padding-block:6px}
.status b{color:var(--ink)}

/* log */
.log{list-style:none;margin:0;padding:0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:120px;overflow:auto}
.log li b{color:var(--ink);font-weight:500}
.log li.sys{color:var(--faint)}
.tablecode{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tablecode .num{font-size:18px;color:var(--ink);letter-spacing:.18em;user-select:all}

/* rules sheet */
.sheet{position:fixed;inset:0;background:rgba(4,12,10,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet .inner{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;max-width:620px;width:100%;max-height:88%;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px}
.sheet h4{font-size:13px;letter-spacing:.08em;color:var(--brass);margin:18px 0 8px}
.rank{width:100%;border-collapse:collapse;font-size:13px}
.rank td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:middle}
.rank td:first-child{width:28px;color:var(--faint);font-family:var(--f-num)}
.rank .nm{font-weight:700;white-space:nowrap}
.rank .ex{display:flex;gap:2px;--cw:24px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:12px;text-align:center}
.flow div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 2px}
.flow b{display:block;font-size:13px}
.flow span{color:var(--muted)}
.defs{width:100%;border-collapse:collapse;font-size:13px}
.defs th{text-align:left;font-weight:700;padding:7px 8px 7px 0;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}
.defs td{padding:7px 0;border-top:1px solid var(--line);color:var(--muted)}
.scroll{overflow-x:auto}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.over{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.over h3{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0}


.chat{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;gap:10px}
.chat-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chat-list{list-style:none;margin:0;padding:0;max-height:210px;min-height:64px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:14px}
.chat-list li{min-width:0;overflow-wrap:anywhere;line-height:1.45}
.chat-list .who{font-weight:700;margin-right:6px;color:var(--brass)}
.chat-list .mine .who{color:var(--ok)}
.chat-list .sys{color:var(--faint);font-size:13px}
.chat-form{display:flex;gap:6px;align-items:center}
.chat-form input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;font-size:16px}
.chat-form .primary{padding:10px 14px;flex:none}
.emoji-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:21px;flex:none;line-height:1}
.emoji-pad{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px}
.emoji-pad button{background:transparent;border:0;font-size:22px;padding:6px 0;border-radius:8px;line-height:1}
.emoji-pad button:hover{background:var(--panel-2)}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;background:var(--card);color:var(--card-ink);font-size:12px;padding:4px 9px;border-radius:12px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.4);animation:pop .2s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%);opacity:1}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}}

.stepper button:disabled{opacity:.35;cursor:not-allowed}
.seatsize{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.seatsize>span:first-child{font-weight:700}
.table.dense .seat{width:62px}
.table.dense .seat .hole{--cw:21px;height:30px}
.table.wide.dense .seat{width:clamp(88px,7.4vw,124px)}
.table.wide.dense .seat .hole{--cw:clamp(32px,2.7vw,44px);height:calc(var(--cw)*1.4)}
.table.dense .plate{padding:3px 4px}
.table.dense .plate .nm,.table.dense .plate .ch{font-size:11px}
.table.dense .plate .st{font-size:9px}
.table.dense:not(.wide) .board{--cw:min(50px,calc((min(100vw - 32px,560px) * .5 - 12px) / 5))}
.table.dense .sit,.table.dense .emptyseat{padding:6px 2px;font-size:10px}

.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.level{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);text-align:center;min-width:0}
.level b{font-family:var(--f-display);font-weight:400;font-size:17px}
.level span{font-size:11px;color:var(--muted);line-height:1.3}
.chips2{grid-template-columns:1fr 1fr}
.level.on{border-color:var(--brass);background:rgba(220,170,79,.14);box-shadow:inset 0 0 0 1px var(--brass)}

.chip{--sz:20px;position:relative;display:block;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;
  background:radial-gradient(circle,var(--c) 0 56%,transparent 57%),repeating-conic-gradient(var(--c) 0 22.5deg,var(--e) 22.5deg 45deg);
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 1px 1px rgba(0,0,0,.45)}
.chip::after{content:"";position:absolute;inset:20%;border-radius:50%;border:1px dashed var(--e);opacity:.75}
.chip b{position:absolute;inset:0;display:grid;place-items:center;font:700 calc(var(--sz)*.32)/1 var(--f-num);color:var(--e);letter-spacing:-.03em}
.stack{display:inline-flex;gap:2px;align-items:flex-end}
.stack .col{position:relative;width:var(--sz);height:calc(var(--sz) + (var(--n) - 1) * var(--sz) * .16)}
.stack .chip{position:absolute;left:0;bottom:calc(var(--i) * var(--sz) * .16)}
.startchips{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;margin-top:5px;--sz:18px}
.startchip{display:inline-flex;align-items:center;gap:3px;font:600 11px var(--f-num);color:var(--ink)}
.plate .ch{display:flex;align-items:center;justify-content:center;gap:3px}
.plate .ch .chip{--sz:11px}
.plate .ch .chip b{display:none}
/* 가로 화면: 테이블 왼쪽, 내 패·채팅 오른쪽 */
body.wide-table .shell{max-width:1440px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;
  grid-template-areas:"bar bar" "note note" "table dock" "table chat" "table log";column-gap:24px;row-gap:12px;align-items:start}
body.wide-table #app{display:contents}
body.wide-table #app>.bar{grid-area:bar}
body.wide-table #app>.note{grid-area:note}
body.wide-table #app>.table{grid-area:table;align-self:start}
body.wide-table #app>.dock{grid-area:dock}
body.wide-table #app>.log{grid-area:log;max-height:200px}
body.wide-table #chatbox{grid-area:chat;margin:0;max-width:none}
body.wide-table .mine .hole{--cw:64px}
@media (max-width:420px){
  .mine .hole{--cw:50px}
  .hero h2{font-size:38px}
  .bar{gap:6px}
  .bar h1{font-size:22px}
  .bar h1 small{display:none}
  .bar .ghost{padding:6px 10px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){.card.new{animation:none}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

/* 더블탭·핀치 확대 막기, 게임 화면 글자 선택 막기 (입력칸은 그대로) */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.chat-list,#invite-url{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
input,textarea,select{font-size:16px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="suit-h" viewBox="0 0 100 100"><path fill="#c3312c" d="M50 92C21 68 4 51 4 31 4 15 16 5 30 5c9 0 16 5 20 13 4-8 11-13 20-13 14 0 26 10 26 26 0 20-17 37-46 61z"/></symbol>
    <symbol id="suit-d" viewBox="0 0 100 100"><path fill="#c3312c" d="M50 2l38 48-38 48-38-48z"/></symbol>
    <symbol id="suit-s" viewBox="0 0 100 100"><path fill="#1c2733" d="M50 3C40 24 7 39 7 61c0 14 11 23 23 23 8 0 14-4 17-10-1 10-5 17-13 23h32c-8-6-12-13-13-23 3 6 9 10 17 10 12 0 23-9 23-23C93 39 60 24 50 3z"/></symbol>
    <symbol id="suit-c" viewBox="0 0 100 100"><g fill="#1c2733"><circle cx="50" cy="27" r="20"/><circle cx="27" cy="58" r="20"/><circle cx="73" cy="58" r="20"/><circle cx="50" cy="52" r="12"/><path d="M47 58c-1 18-5 28-14 37h34c-9-9-13-19-14-37z"/></g></symbol>
    <pattern id="card-back" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#8e2a22"/><rect width="6" height="6" fill="#a8372d"/><circle cx="9" cy="9" r="1.6" fill="#e9dcc0" opacity=".55"/>
    </pattern>
  </defs>
</svg>
<main class="shell">

<script>

/* ================= 카드 & 족보 ================= */
const RANKS = '23456789TJQKA';
const SUIT_SYM = {s:'♠',h:'♥',d:'♦',c:'♣'};
const FULL = []; for (const r of RANKS) for (const s of 'shdc') FULL.push(r+s);
const rv = c => RANKS.indexOf(c[0]) + 2;
const HAND = ['하이카드','원 페어','투 페어','트리플','스트레이트','플러시','풀 하우스','포카드','스트레이트 플러시'];
const SEATS = 6, MIN_SEATS = 2, MAX_SEATS = 9, START_CHIPS = 10000, SB = 10, BB = 20;
// 시작 칩에 따라 블라인드가 정해짐
const CHIP_OPTIONS = { 1000: {sb:10, bb:20}, 10000: {sb:50, bb:100} };
const TURN_MS = 30000, NEXT_MS = 6000;
const BETTING = new Set(['preflop','flop','turn','river']);
const STAGE_KO = {idle:'대기 중',preflop:'프리플랍',flop:'플랍',turn:'턴',river:'리버',done:'핸드 종료'};

function randInt(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function newDeck(){ const d = FULL.slice(); for (let i=d.length-1;i>0;i--){ const j=randInt(i+1); [d[i],d[j]]=[d[j],d[i]]; } return d; }
const clone = o => JSON.parse(JSON.stringify(o));

const comboCache = {};
function combos(n){
  if (comboCache[n]) return comboCache[n];
  const out = [], idx = [];
  (function rec(start){ if (idx.length===5){ out.push(idx.slice()); return; } for (let i=start;i<n;i++){ idx.push(i); rec(i+1); idx.pop(); } })(0);
  return comboCache[n] = out;
}
function eval5(cs){
  const v = cs.map(rv).sort((a,b)=>b-a);
  const flush = cs.every(c=>c[1]===cs[0][1]);
  const uniq = new Set(v).size;
  let sh = 0;
  if (uniq===5){ if (v[0]-v[4]===4) sh=v[0]; else if (v[0]===14 && v[1]===5) sh=5; }
  const cnt = {}; v.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const g = Object.entries(cnt).map(([k,n])=>[+k,n]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  let cat, ks;
  if (sh && flush){ cat=8; ks=[sh]; }
  else if (g[0][1]===4){ cat=7; ks=[g[0][0],g[1][0]]; }
  else if (g[0][1]===3 && g[1][1]===2){ cat=6; ks=[g[0][0],g[1][0]]; }
  else if (flush){ cat=5; ks=v; }
  else if (sh){ cat=4; ks=[sh]; }
  else if (g[0][1]===3){ cat=3; ks=g.map(x=>x[0]); }
  else if (g[0][1]===2 && g[1][1]===2){ cat=2; ks=g.map(x=>x[0]); }
  else if (g[0][1]===2){ cat=1; ks=g.map(x=>x[0]); }
  else { cat=0; ks=v; }
  let score = cat; for (let i=0;i<5;i++) score = score*15 + (ks[i]||0);
  return {score, cat, ks};
}
function best(cards){
  let b = null;
  if (cards.length < 5) return null;
  for (const idx of combos(cards.length)){
    const five = idx.map(i=>cards[i]); const h = eval5(five);
    if (!b || h.score > b.score){ b = h; b.cards = five; }
  }
  return b;
}
function handName(h){ if (!h) return ''; if (h.cat===8 && h.ks[0]===14) return '로열 플러시'; return HAND[h.cat]; }

/* ================= 게임 엔진 (텍사스 홀덤 규칙) ================= */
function makeSeat(id, extra){ return Object.assign({id, chips:START_CHIPS, bet:0, total:0, cards:[], inHand:false, folded:false, allin:false, acted:false, canRaise:true, sitOut:false, shown:false, hn:'', r:0}, extra||{}); }
function emptyTable(n, chips){ const c = CHIP_OPTIONS[chips] ? +chips : START_CHIPS, o = CHIP_OPTIONS[c] || {sb:SB, bb:BB}; return {v:1, seq:0, handNo:0, stage:'idle', seats:Array(n||SEATS).fill(null), startChips:c, sb:o.sb, bb:o.bb, dealer:-1, sbI:-1, bbI:-1, toAct:-1, currentBet:0, minRaise:o.bb, board:[], deck:[], winners:[], log:[], turnDeadline:0, nextHandAt:0, uncontested:false}; }
function nextIdx(s, from, pred){ const N=s.seats.length; for (let k=1;k<=N;k++){ const i=((from+k)%N+N)%N; const p=s.seats[i]; if (p && pred(p,i)) return i; } return -1; }
function idxs(s, pred){ const o=[]; s.seats.forEach((p,i)=>{ if (p && pred(p,i)) o.push(i); }); return o; }
function potSize(s){ return s.seats.reduce((a,p)=>a+(p&&p.inHand?p.total:0),0); }
function logIt(s, i, m){ s.log.push({i, id: i>=0 && s.seats[i] ? s.seats[i].id : '', n: i>=0 && s.seats[i] ? (s.seats[i].name||'') : '', m}); if (s.log.length>40) s.log.splice(0, s.log.length-40); }
function commit(p, amt){ p.chips-=amt; p.bet+=amt; p.total+=amt; if (p.chips===0) p.allin=true; }

function startHand(s0, now){
  const s = clone(s0);
  s.seats = s.seats.map(p => p && p.leaving ? null : p);
  s.seats.forEach(p=>{ if (!p) return; Object.assign(p,{bet:0,total:0,cards:[],folded:false,allin:false,acted:false,canRaise:true,shown:false,hn:'',r:0}); p.inHand = !p.sitOut && p.chips>0; });
  const players = idxs(s, p=>p.inHand);
  s.winners = []; s.board = []; s.uncontested = false; s.toAct = -1;
  if (players.length < 2){ s.stage='idle'; s.seats.forEach(p=>{ if(p) p.inHand=false; }); return s; }
  s.handNo++;
  s.dealer = nextIdx(s, s.dealer<0 || s.dealer>=s.seats.length ? s.seats.length-1 : s.dealer, p=>p.inHand);
  const inH = p=>p.inHand;
  s.sbI = players.length===2 ? s.dealer : nextIdx(s, s.dealer, inH);   // 헤즈업: 딜러가 스몰 블라인드
  s.bbI = nextIdx(s, s.sbI, inH);
  s.deck = newDeck();
  const sbAmt = s.sb || SB, bbAmt = s.bb || BB;
  commit(s.seats[s.sbI], Math.min(sbAmt, s.seats[s.sbI].chips));
  commit(s.seats[s.bbI], Math.min(bbAmt, s.seats[s.bbI].chips));
  s.currentBet = Math.max(...players.map(i=>s.seats[i].bet));
  s.minRaise = bbAmt;
  for (let round=0; round<2; round++){ let i=s.dealer; for (let k=0;k<players.length;k++){ i=nextIdx(s,i,inH); s.seats[i].cards.push(s.deck.pop()); } }
  s.stage = 'preflop';
  logIt(s, -1, `${s.handNo}번째 핸드 · 블라인드 $${sbAmt}/$${bbAmt}`);
  advance(s, s.bbI, now);
  return s;
}

function legal(s, i){
  const p = s.seats[i];
  const callAmt = Math.min(Math.max(0, s.currentBet - p.bet), p.chips);
  const canCheck = p.bet >= s.currentBet;
  const others = idxs(s,(q,j)=>j!==i && q.inHand && !q.folded && !q.allin).length;
  const maxTo = p.bet + p.chips;
  const minTo = s.currentBet + s.minRaise;
  const canRaise = p.canRaise && maxTo > s.currentBet && others > 0;
  return {callAmt, canCheck, canRaise, minTo: Math.min(minTo, maxTo), maxTo, fullMin: minTo};
}

function act(s0, i, a, now){
  if (!BETTING.has(s0.stage) || s0.toAct !== i) return null;
  const s = clone(s0); const p = s.seats[i]; const L = legal(s, i);
  if (a.type==='fold'){ p.folded = true; logIt(s,i,'폴드'); }
  else if (a.type==='check'){ if (!L.canCheck) return null; logIt(s,i,'체크'); }
  else if (a.type==='call'){
    if (L.canCheck) { logIt(s,i,'체크'); }
    else { commit(p, L.callAmt); logIt(s,i,`콜 ${fmt(L.callAmt)}${p.allin?' (올인)':''}`); }
  }
  else if (a.type==='raise'){
    if (!L.canRaise) return null;
    let to = Math.round(+a.to||0);
    to = Math.max(L.minTo, Math.min(to, L.maxTo));
    const word = s.currentBet===0 ? '베팅' : '레이즈';
    commit(p, to - p.bet);
    const size = to - s.currentBet;
    if (size >= s.minRaise){
      s.minRaise = size;
      s.seats.forEach((q,j)=>{ if (q && j!==i && q.inHand && !q.folded && !q.allin){ q.acted=false; q.canRaise=true; } });
    } else {
      // 최소 레이즈에 못 미치는 올인: 이미 액션한 사람은 콜/폴드만 가능
      s.seats.forEach((q,j)=>{ if (q && j!==i && q.inHand && !q.folded && !q.allin){ if (q.acted) q.canRaise=false; q.acted=false; } });
    }
    s.currentBet = to; p.r = (p.r||0)+1;
    logIt(s,i, p.allin ? `올인 ${fmt(to)}` : `${word} ${fmt(to)}`);
  } else return null;
  p.acted = true;
  advance(s, i, now);
  return s;
}

function returnUncalled(s){
  const live = idxs(s, p=>p.inHand);
  const sorted = live.map(i=>s.seats[i].bet).sort((a,b)=>b-a);
  if (sorted.length<2 || sorted[0]===sorted[1]) return;
  const top = live.find(i=>s.seats[i].bet===sorted[0]); const p = s.seats[top]; const d = sorted[0]-sorted[1];
  p.bet-=d; p.total-=d; p.chips+=d; if (p.chips>0) p.allin=false;
}

function dealStreet(s){
  s.deck.pop(); // 번 카드
  if (s.stage==='preflop'){ s.board.push(s.deck.pop(), s.deck.pop(), s.deck.pop()); s.stage='flop'; }
  else if (s.stage==='flop'){ s.board.push(s.deck.pop()); s.stage='turn'; }
  else if (s.stage==='turn'){ s.board.push(s.deck.pop()); s.stage='river'; }
}

function advance(s, from, now){
  const S = s.seats;
  const alive = idxs(s, p=>p.inHand && !p.folded);
  if (alive.length===1){ returnUncalled(s); finishUncontested(s, alive[0], now); return; }
  const canAct = alive.filter(i=>!S[i].allin);
  const pending = canAct.filter(i=>!S[i].acted || S[i].bet < s.currentBet);
  const done = pending.length===0 || (canAct.length===1 && S[canAct[0]].bet >= s.currentBet);
  if (!done){ s.toAct = nextIdx(s, from, (p,i)=>pending.includes(i)); s.turnDeadline = now + TURN_MS; return; }
  returnUncalled(s);
  S.forEach(p=>{ if (p){ p.bet=0; p.acted=false; p.canRaise=true; p.r=0; } });
  s.currentBet = 0; s.minRaise = s.bb || BB;
  if (s.stage==='river'){ showdown(s, now); return; }
  dealStreet(s);
  const actors = alive.filter(i=>!S[i].allin);
  if (actors.length<=1){ while (s.stage!=='river') dealStreet(s); showdown(s, now); return; }
  s.toAct = nextIdx(s, s.dealer, p=>p.inHand && !p.folded && !p.allin);
  s.turnDeadline = now + TURN_MS;
}

function finishUncontested(s, w, now){
  const amt = potSize(s); s.seats[w].chips += amt;
  s.winners = [{s:w, amt, h:''}]; s.uncontested = true;
  logIt(s, w, `${fmt(amt)} 획득 (모두 폴드)`);
  endHand(s, now);
}

function showdown(s, now){
  const S = s.seats;
  const alive = idxs(s, p=>p.inHand && !p.folded);
  const ev = {}; alive.forEach(i=>{ ev[i] = best(S[i].cards.concat(s.board)); S[i].shown = true; S[i].hn = handName(ev[i]); });
  const contrib = idxs(s, p=>p.inHand);
  const levels = [...new Set(alive.map(i=>S[i].total))].sort((a,b)=>a-b);
  const pots = []; let prev = 0;
  levels.forEach((L,k)=>{
    let amt = 0; contrib.forEach(i=>{ amt += Math.min(S[i].total, L) - Math.min(S[i].total, prev); });
    if (k===levels.length-1) contrib.forEach(i=>{ amt += Math.max(0, S[i].total - L); }); // 폴드한 사람의 초과분
    pots.push({amt, el: alive.filter(i=>S[i].total>=L)}); prev = L;
  });
  const won = {};
  pots.forEach(pt=>{
    if (!pt.amt) return;
    const top = Math.max(...pt.el.map(i=>ev[i].score));
    const ws = pt.el.filter(i=>ev[i].score===top);
    // 남는 칩은 딜러 왼쪽부터
    const N = s.seats.length; ws.sort((a,b)=>((a-s.dealer+N-1)%N)-((b-s.dealer+N-1)%N));
    const share = Math.floor(pt.amt/ws.length); let rem = pt.amt - share*ws.length;
    ws.forEach(i=>{ const g = share + (rem>0?1:0); if (rem>0) rem--; won[i]=(won[i]||0)+g; });
  });
  s.winners = Object.entries(won).map(([i,amt])=>({s:+i, amt, h:handName(ev[i])}));
  s.winners.forEach(w=>{ S[w.s].chips += w.amt; logIt(s, w.s, `${fmt(w.amt)} 획득 · ${w.h}`); });
  s.uncontested = false;
  endHand(s, now);
}
function endHand(s, now){ s.stage='done'; s.toAct=-1; s.currentBet=0; s.nextHandAt = now + NEXT_MS; s.seats.forEach(p=>{ if(p){ p.bet=0; } }); }

/* ================= 컴퓨터 플레이어 ================= */
function equity(hole, board, nOpp, iters){
  const used = new Set(hole.concat(board)); const rest = FULL.filter(c=>!used.has(c));
  const need = 5 - board.length; let w = 0;
  for (let t=0;t<iters;t++){
    const n = need + 2*nOpp;
    for (let k=0;k<n;k++){ const j = k + Math.floor(Math.random()*(rest.length-k)); [rest[k],rest[j]]=[rest[j],rest[k]]; }
    const b = board.concat(rest.slice(0,need));
    const me = best(hole.concat(b)).score; let top = 0;
    for (let o=0;o<nOpp;o++){ const sc = best([rest[need+2*o],rest[need+2*o+1]].concat(b)).score; if (sc>top) top=sc; }
    if (me>top) w+=1; else if (me===top) w+=0.5;
  }
  return w/iters;
}
// 난이도: easy(쉬움) / normal(보통) / hard(어려움)
function botDecide(s, i){
  const BB = s.bb || 20;   // 이 테이블의 빅 블라인드
  const level = s.level || 'normal';
  const p = s.seats[i], L = legal(s,i), per = p.per || {agg:.5, loose:.03};
  const alive = idxs(s,q=>q.inHand && !q.folded);
  const nOpp = Math.max(1, alive.length - 1);
  const pot = potSize(s);
  const r = Math.random();
  const round10 = v => Math.round(v/10)*10;
  const raiseTo = to => ({type:'raise', to: round10(to)});
  let odds = L.callAmt>0 ? L.callAmt/(pot+L.callAmt) : 0;

  if (level==='easy'){
    // 계산을 대충 하고, 자주 따라가며, 작게 베팅하고, 블러핑하지 않음
    let eq = equity(p.cards, s.board, nOpp, 70) + (Math.random()-.5)*.24;
    const rel = eq*(nOpp+1);
    if (L.canRaise && (p.r||0) < 1 && rel > 2.0 && r < .55)
      return raiseTo(s.currentBet + Math.max(BB, (pot+L.callAmt)*(.25+Math.random()*.25)));
    if (L.canCheck) return {type:'check'};
    const bigBet = L.callAmt > (p.chips+p.bet)*.45;
    if (bigBet && eq < .45 && r < .7) return {type:'fold'};
    if (eq + .18 >= odds*.8) return {type:'call'};
    return r < .25 ? {type:'call'} : {type:'fold'};
  }

  if (level==='hard'){
    // 계산을 많이 하고, 포지션·팟 오즈·상대의 큰 베팅을 반영
    let eq = equity(p.cards, s.board, nOpp, s.board.length ? 520 : 420);
    const facing = L.callAmt>0 ? L.callAmt/Math.max(BB, pot) : 0;
    eq = Math.max(0, eq - Math.min(.22, facing*.12));          // 크게 베팅받으면 상대 패를 강하게 봄
    const rel = eq*(nOpp+1);
    const order = (i - s.dealer + s.seats.length) % s.seats.length;
    const late = i===s.dealer || order===0 || alive.length<=3;  // 늦은 포지션
    const stack = p.chips + p.bet;
    if (s.stage==='preflop'){
      const openT = late ? 1.25 : 1.45;
      if (L.canRaise && (p.r||0) < 2 && rel > (s.currentBet>BB ? 1.75 : openT)){
        const base = s.currentBet>BB ? s.currentBet*3 : BB*(late?2.5:3);
        if (rel > 2.3 && r < .3) return raiseTo(L.maxTo);
        return raiseTo(Math.max(L.minTo, base));
      }
      if (L.canCheck) return {type:'check'};
      if (L.callAmt <= BB && rel > .9) return {type:'call'};
      if (eq >= odds*.85 && rel > 1.05) return {type:'call'};
      return {type:'fold'};
    }
    if (L.canRaise && (p.r||0) < 2){
      if (rel > 1.55 && eq > .5){
        const size = (pot+L.callAmt)*(.6+Math.random()*.35);
        if (eq > .82 && (stack < pot*1.5 || r < .25)) return raiseTo(L.maxTo);
        return raiseTo(s.currentBet + Math.max(BB, size));
      }
      // 블러핑·세미블러핑 (상대가 적을 때, 체크로 넘어왔을 때)
      if (L.canCheck && nOpp<=2 && ((s.stage==='flop' && eq>.32 && r<.3) || (s.stage!=='flop' && r < .14 + per.agg*.08)))
        return raiseTo(s.currentBet + Math.max(BB, pot*(.5+Math.random()*.25)));
    }
    if (L.canCheck) return {type:'check'};
    if (L.callAmt >= p.chips && eq < .55 && rel < 1.6) return {type:'fold'};
    if (eq >= odds + .02) return {type:'call'};
    return {type:'fold'};
  }

  // 보통
  const eq = equity(p.cards, s.board, nOpp, s.board.length ? 260 : 200);
  const rel = eq*(nOpp+1);
  if (s.stage==='preflop') odds *= .7;
  if (L.canRaise && (p.r||0) < 2){
    const value = rel > 1.75 - per.agg*.45 && eq > .3;
    const bluff = L.canCheck && s.stage!=='preflop' && r < .05 + per.agg*.07;
    if (value || bluff){
      if (eq > .8 && r < .35) return raiseTo(L.maxTo);
      return raiseTo(s.currentBet + Math.max(BB, (pot + L.callAmt) * (.45 + Math.random()*.55)));
    }
  }
  if (L.canCheck) return {type:'check'};
  if (eq + per.loose >= odds) return {type:'call'};
  if (L.callAmt <= BB && eq > .12) return {type:'call'};
  return {type:'fold'};
}

/* ================= 화면 ================= */
const app = document.getElementById('app');
const fmt = n => '$' + Number(n||0).toLocaleString('en-US');   // 칩 금액은 달러로 표시
const esc = t => String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view = 'lobby', botCount = 3;
let hostSeats = Math.max(2, Math.min(9, parseInt(store('holdem.seats')) || 6));
const LEVELS = {
  easy:   {name:'이지',  desc:'자주 따라오고 블러핑 없음'},
  normal: {name:'보통',  desc:'무난한 실력'},
  hard:   {name:'하드',  desc:'계산 정확, 블러핑도 함'},
};
let botLevel = LEVELS[store('holdem.level')] ? store('holdem.level') : 'normal';
let chipChoice = CHIP_OPTIONS[store('holdem.chips')] ? +store('holdem.chips') : 10000;
const blindsOf = c => CHIP_OPTIONS[c] || {sb:SB, bb:BB};
let localState = null, localTimer = null;
let ui = {raiseOpen:false, raiseTo:0, raiseKey:'', seenCards:new Set(), bubbles:{}};

/* 이 기기의 플레이어 정보 */
function store(k, v){ try { if (v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(_){ return null; } }
// 플레이어 ID는 탭마다 따로(새로고침해도 유지), 이름은 기기에 저장
function tabStore(k, v){ try { if (v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch(_){ return null; } }
const me = {

  name: store('holdem.name') || ('플레이어' + (10 + randInt(90))),
};
const cleanName = n => String(n||'').replace(/\s+/g,' ').trim().slice(0,10) || '플레이어';

/* ---------- 카드 그림 (SVG, 100×140 기준) ---------- */
// 숫자 카드 문양 위치 (아래쪽 절반은 실제 카드처럼 거꾸로)
const PIPS = {
  A: [[50,70]],
  2: [[50,30],[50,110]],
  3: [[50,30],[50,70],[50,110]],
  4: [[30,30],[70,30],[30,110],[70,110]],
  5: [[30,30],[70,30],[50,70],[30,110],[70,110]],
  6: [[30,30],[70,30],[30,70],[70,70],[30,110],[70,110]],
  7: [[30,30],[70,30],[50,50],[30,70],[70,70],[30,110],[70,110]],
  8: [[30,30],[70,30],[50,50],[30,70],[70,70],[50,90],[30,110],[70,110]],
  9: [[30,28],[70,28],[30,56],[70,56],[50,70],[30,84],[70,84],[30,112],[70,112]],
  T: [[30,28],[70,28],[50,42],[30,56],[70,56],[30,84],[70,84],[50,98],[30,112],[70,112]],
};
const RANK_TXT = r => r==='T' ? '10' : r;
function pip(s, x, y, size, flip){
  const h = size/2;
  return `<use href="#suit-${s}" x="${x-h}" y="${y-h}" width="${size}" height="${size}"${flip?` transform="rotate(180 ${x} ${y})"`:''}/>`;
}
// 그림 카드 인물 (위쪽 절반을 그리고 180도 돌려서 아래쪽에 한 번 더)
function courtHalf(r, s, ink){
  const crown = r==='K'
    ? `<path d="M39 33 L39 23 L44 28 L50 20 L56 28 L61 23 L61 33 Z" fill="#e2b13c" stroke="#7a5a12" stroke-width="1"/><circle cx="50" cy="20" r="2" fill="#c3312c"/>`
    : r==='Q'
    ? `<path d="M40 33 L41 25 L45.5 29 L50 23 L54.5 29 L59 25 L60 33 Z" fill="#e2b13c" stroke="#7a5a12" stroke-width="1"/><circle cx="41" cy="24.5" r="1.8" fill="#fff"/><circle cx="50" cy="22.5" r="1.8" fill="#fff"/><circle cx="59" cy="24.5" r="1.8" fill="#fff"/>`
    : `<path d="M39 34 Q50 19 61 34 Z" fill="${ink}" stroke="#2b2b2b" stroke-width="1"/><path d="M59 30 Q67 20 64 14" stroke="#e2b13c" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  const hair = r==='Q' ? `<path d="M40 36 Q38 48 42 54 L44 40 Z M60 36 Q62 48 58 54 L56 40 Z" fill="#7a4a1c"/>` : '';
  const beard = r==='K' ? `<path d="M44 46 Q50 56 56 46 Q53 49 50 49 Q47 49 44 46 Z" fill="#d9d2c3" stroke="#8a7f6a" stroke-width=".6"/>` : '';
  const item = r==='K'
    ? `<path d="M68 70 L68 36" stroke="#9aa4ad" stroke-width="2.4"/><path d="M64 40 L72 40" stroke="#7a5a12" stroke-width="2.4"/>`
    : r==='Q'
    ? `<path d="M32 66 L33 44" stroke="#2f6b34" stroke-width="1.6"/><circle cx="33" cy="42" r="3.6" fill="#c3312c"/><circle cx="33" cy="42" r="1.4" fill="#e2b13c"/>`
    : `<path d="M31 70 L31 40" stroke="#7a5a12" stroke-width="2"/><path d="M28 42 L31 34 L34 42 Z" fill="#9aa4ad"/>`;
  return `<path d="M30 70 L33 56 Q36 51 44 50 L56 50 Q64 51 67 56 L70 70 Z" fill="${ink}" stroke="#2b2b2b" stroke-width="1"/>
    <path d="M44 50 L50 62 L56 50" fill="#e2b13c" stroke="#7a5a12" stroke-width=".8"/>
    <path d="M36 70 L38 60 M64 70 L62 60" stroke="#e2b13c" stroke-width="1.6"/>
    ${hair}<circle cx="50" cy="41" r="7.5" fill="#f3d9b5" stroke="#2b2b2b" stroke-width="1"/>
    <circle cx="47.3" cy="40" r=".9" fill="#2b2b2b"/><circle cx="52.7" cy="40" r=".9" fill="#2b2b2b"/>
    ${beard}${crown}${item}${pip(s, 27, 29, 9)}`;
}
function cardSVG(c, mini){
  const r = c[0], s = c[1], red = s==='h' || s==='d';
  const ink = red ? '#c3312c' : '#1c2733';
  if (mini){
    return `<svg viewBox="0 0 100 140" aria-hidden="true"><rect x="1.5" y="1.5" width="97" height="137" rx="10" fill="#fdfbf5" stroke="#bdb6a4" stroke-width="2"/>
      <text x="50" y="62" text-anchor="middle" font-size="${r==='T'?50:58}" font-weight="700" fill="${ink}" font-family="Georgia,'Times New Roman',serif">${RANK_TXT(r)}</text>
      ${pip(s, 50, 98, 52)}</svg>`;
  }
  const idx = `<text x="12" y="25" text-anchor="middle" font-size="${r==='T'?17:21}" font-weight="700" fill="${ink}" font-family="Georgia,'Times New Roman',serif" letter-spacing="${r==='T'?-1.5:0}">${RANK_TXT(r)}</text>${pip(s, 12, 36, 12)}`;
  let middle;
  if (PIPS[r]) {
    const big = r==='A' ? (s==='s' ? 46 : 34) : 19;
    middle = PIPS[r].map(([x,y])=>pip(s, x, y, big, y>70)).join('');
  } else {
    middle = `<rect x="22" y="18" width="56" height="104" rx="3" fill="#f6ead0" stroke="${ink}" stroke-width="1.6"/>
      <clipPath id="cf-${c}"><rect x="23" y="19" width="54" height="102" rx="2"/></clipPath>
      <g clip-path="url(#cf-${c})">${courtHalf(r, s, ink)}<g transform="rotate(180 50 70)">${courtHalf(r, s, ink)}</g></g>
      <path d="M22 70 L78 70" stroke="${ink}" stroke-width=".8" opacity=".5"/>`;
  }
  return `<svg viewBox="0 0 100 140" aria-hidden="true"><rect x="1.5" y="1.5" width="97" height="137" rx="8" fill="#fdfbf5" stroke="#bdb6a4" stroke-width="1.5"/>
    ${middle}${idx}<g transform="rotate(180 50 70)">${idx}</g></svg>`;
}
const BACK_SVG = `<svg viewBox="0 0 100 140" aria-hidden="true"><rect x="1.5" y="1.5" width="97" height="137" rx="8" fill="#fdfbf5" stroke="#bdb6a4" stroke-width="1.5"/>
  <rect x="7" y="7" width="86" height="126" rx="5" fill="url(#card-back)"/><rect x="7" y="7" width="86" height="126" rx="5" fill="none" stroke="#e9dcc0" stroke-width="1.2"/>
  <rect x="13" y="13" width="74" height="114" rx="3" fill="none" stroke="#e9dcc0" stroke-width=".8" opacity=".7"/></svg>`;
function cardHTML(c, opts={}){
  if (!c) return `<div class="card empty"></div>`;
  if (c==='back') return `<div class="card back">${BACK_SVG}</div>`;
  const key = (opts.key||'') + c;
  const fresh = opts.animate && !ui.seenCards.has(key); if (opts.animate) ui.seenCards.add(key);
  const label = `${RANK_TXT(c[0])} ${({s:'스페이드',h:'하트',d:'다이아',c:'클로버'})[c[1]]}`;
  return `<div class="card${opts.hl?' hl':''}${opts.dim?' dim':''}${fresh?' new':''}" role="img" aria-label="${label}">${cardSVG(c, opts.mini)}</div>`;
}

/* ---------- 카지노 칩 ---------- */
const CHIPS = [
  {v:5000, c:'#8c1d40', e:'#f3d27a', t:'5K'},
  {v:1000, c:'#e0a12a', e:'#3a2a0a', t:'1K'},
  {v:500,  c:'#6a3d9a', e:'#f4efe4', t:'500'},
  {v:100,  c:'#1d1f22', e:'#f4efe4', t:'100'},
  {v:25,   c:'#1f8a4c', e:'#f4efe4', t:'25'},
  {v:5,    c:'#c62f2f', e:'#f4efe4', t:'5'},
  {v:1,    c:'#f2efe6', e:'#2d5fa8', t:'1'},
];
// 시작 칩 구성 (이 개수로 테이블에 앉음)
const START_STACKS = {
  1000:  [[100,4],[25,16],[5,40]],              // $400 + $400 + $200
  10000: [[1000,4],[500,6],[100,20],[25,40]],    // $4,000 + $3,000 + $2,000 + $1,000
};
function chipParts(amount){
  const out = []; let left = Math.max(0, Math.round(amount));
  for (const ch of CHIPS){ const n = Math.floor(left / ch.v); if (n){ out.push([ch, n]); left -= n*ch.v; } }
  return out;
}
function chipOne(ch, i){ return `<i class="chip" style="--c:${ch.c};--e:${ch.e}${i!=null?`;--i:${i}`:''}"><b>${ch.t}</b></i>`; }
// 금액을 칩 더미로 표시 (칩 종류별로 기둥, 기둥마다 최대 maxPer개)
function chipStack(amount, {cols=3, maxPer=6}={}){
  const parts = chipParts(amount).slice(0, cols);
  if (!parts.length) return '';
  return `<span class="stack">${parts.map(([ch,n])=>{
    const k = Math.min(n, maxPer);
    return `<span class="col" style="--n:${k}">${Array.from({length:k},(_,i)=>chipOne(ch, i)).join('')}</span>`;
  }).join('')}</span>`;
}
function startStackHTML(total){
  const parts = START_STACKS[total] || [];
  return parts.map(([v,n])=>{ const ch = CHIPS.find(x=>x.v===v); return `<span class="startchip">${chipOne(ch)}<span>×${n}</span></span>`; }).join('');
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true, 2600); }

function myId(){ return view==='local' ? 'me' : me.pid; }
function nameOf(s, i){
  const p = s.seats[i]; if (!p) return '';
  if (p.id===myId()) return '나';
  return p.name || `플레이어 ${i+1}`;
}
function logName(s, e){
  const p = s.seats[e.i];
  if (p && p.id===e.id) return nameOf(s, e.i);
  return e.n || '';
}

/* ---------- 테이블 ---------- */
// 자리 위치(테이블 너비·높이 %): 내 자리(0)를 맨 아래 가운데에 두고 시계 방향.
// 세로 화면: 가로로 긴 타원 위·아래에 줄지어 앉고, 인원이 많으면 양옆에도 앉음
const SEAT_LAYOUT = {
  2: [[50,90],[50,11]],
  3: [[50,90],[25,11],[75,11]],
  4: [[50,90],[11,50],[50,11],[89,50]],
  5: [[50,90],[19,89],[25,11],[75,11],[81,89]],
  6: [[50,90],[18,89],[18,11],[50,11],[82,11],[82,89]],
  7: [[50,90],[22,89],[10,50],[30,11],[70,11],[90,50],[78,89]],
  8: [[50,90],[22,89],[10,50],[18,11],[50,11],[82,11],[90,50],[78,89]],
  9: [[50,90],[22,89],[10,50],[14,11],[38,11],[62,11],[86,11],[90,50],[78,89]],
};
// 가로 화면(PC·태블릿): 2:1 타원 테두리를 따라 고르게
function wideSlot(k, N){ const a = Math.PI/2 + k*2*Math.PI/N; return [50 + 44*Math.cos(a), 50 + 40*Math.sin(a)]; }
const isWide = () => innerWidth >= 1000 && innerWidth > innerHeight;
// 베팅 칩 위치: 자리에서 가운데 쪽으로, 공용 카드·팟과 자기 자리를 피해서 (단위: 테이블 %)
function betPos(x, y, dense){
  const wide = isWide();
  const C = wide ? {l:25, r:75, t:30, b:70} : {l:dense?23:20, r:dense?77:80, t:34, b:68};   // 가운데(카드·팟) 영역
  const bw = wide ? 4.5 : 8, bh = wide ? 6.5 : 5;                                            // 칩 더미 반쪽 크기
  const sw = wide ? 6 : (dense ? 10 : 11), sh = wide ? 11 : 11;                              // 자리 반쪽 크기
  const clear = (bx, by) => (bx+bw < C.l || bx-bw > C.r || by+bh < C.t || by-bh > C.b) && (Math.abs(bx-x) > sw+bw || Math.abs(by-y) > sh+bh);
  for (let f = .5; f >= .12; f -= .02){ const bx = x + (50-x)*f, by = y + (50-y)*f; if (clear(bx, by)) return [bx, by]; }
  return [x + (x<50 ? 1 : -1)*(sw*.4), y + sh + bh + 1];   // 옆자리: 자리 바로 아래
}
// 그려진 뒤 실제 크기를 재서, 베팅 칩이 카드·팟·자리·다른 칩과 겹치지 않는 첫 자리로 옮김
function placeBets(){
  const table = app.querySelector('.table'); if (!table) return;
  const bets = [...table.querySelectorAll('.betchip')]; if (!bets.length) return;
  const T = table.getBoundingClientRect(), R = e => e.getBoundingClientRect();
  const hit = (a, c) => a.left < c.right-1 && c.left < a.right-1 && a.top < c.bottom-1 && c.top < a.bottom-1;
  const blockers = [...table.querySelectorAll('.center .board, .center .pot, .center .stage, .seat')].map(R);
  const placed = [];
  bets.forEach(el=>{
    const x = +el.dataset.x, y = +el.dataset.y, side = x < 50 ? 1 : -1, cands = [];
    for (let f = .5; f >= .14; f -= .04) cands.push([x + (50-x)*f, y + (50-y)*f]);
    cands.push([x + side*13, y], [x + side*9, y + (y<50 ? 15 : -15)], [x, y + (y<50 ? 19 : -19)], [x + side*9, y + (y<50 ? -15 : 15)], [x + side*17, y + (y<50 ? 8 : -8)]);
    for (const [bx, by] of cands){
      el.style.left = bx + '%'; el.style.top = by + '%';
      const r = R(el);
      if (r.left >= T.left && r.right <= T.right && !blockers.some(b=>hit(r, b)) && !placed.some(b=>hit(r, b))){ placed.push(r); return; }
    }
    el.style.left = cands[0][0] + '%'; el.style.top = cands[0][1] + '%'; placed.push(R(el));
  });
}
function slotPos(k, N){ return isWide() ? wideSlot(k, N) : (SEAT_LAYOUT[N] || SEAT_LAYOUT[6])[k]; }
function currentState(){ return view==='local' ? localState : net.state; }
function renderTable(){
  const s = currentState();
  const head = view==='local'
    ? `<div class="bar"><h1>홀덤 테이블<small>컴퓨터 · ${LEVELS[s && s.level || 'normal'].name}</small></h1><button class="ghost" data-a="rules">족보</button><button class="ghost" data-a="leave">나가기</button></div>`
    : `<div class="bar"><h1>홀덤 테이블<small>${net.role==='host'?'온라인 · 방장':'온라인'}</small></h1><button class="ghost" data-a="invite">초대 링크</button><button class="ghost" data-a="rules">족보</button><button class="ghost" data-a="leave">나가기</button></div>`;
  const statusLine = view==='online' && net.status ? `<p class="note warn">${esc(net.status)}</p>` : '';
  if (!s){ app.innerHTML = `${head}${statusLine}<p class="status">${view==='online' && net.role==='guest' ? '방에 연결하는 중…' : '테이블을 준비하는 중…'}</p>${view==='online'&&net.status?`<button class="primary" data-a="leave">처음 화면으로</button>`:''}`; return; }
  const meId = myId();
  const myIdx = s.seats.findIndex(p=>p && p.id===meId);
  const base = myIdx>=0 ? myIdx : 0;
  const now = Date.now();
  const betting = BETTING.has(s.stage);
  const winSet = new Set(s.winners.map(w=>w.s));
  const showAll = s.stage==='done' && !s.uncontested;
  const winCards = new Set();
  if (showAll) s.winners.forEach(w=>{ const b = best(s.seats[w.s].cards.concat(s.board)); b && b.cards.forEach(c=>winCards.add(c)); });

  let seatsHTML = '', chips = '';
  const N = s.seats.length;
  for (let i=0;i<N;i++){
    const slot = (i - base + N) % N; const [x,y] = slotPos(slot, N);
    const p = s.seats[i];
    if (!p){
      if (view==='local') continue;
      seatsHTML += `<div class="seat" style="left:${x}%;top:${y}%">${myIdx<0 ? `<button class="sit" data-a="sit" data-i="${i}">여기 앉기</button>` : `<div class="emptyseat">빈 자리</div>`}</div>`;
      continue;
    }
    const isMe = i===myIdx;
    const acting = betting && s.toAct===i;
    const cls = ['seat', acting?'acting':'', p.folded&&p.inHand?'folded':'', (!p.inHand && p.chips===0)?'out':'', winSet.has(i)&&s.stage==='done'?'win':''].join(' ');
    let hole = '';
    if (!isMe && p.inHand && !p.folded){
      const reveal = showAll && p.shown && p.cards[0] !== 'back';
      hole = p.cards.map(c=>reveal ? cardHTML(c,{mini:true, hl:winSet.has(i)&&winCards.has(c), dim: winSet.size && !winSet.has(i)}) : cardHTML('back')).join('');
    }
    let st = '';
    if (s.stage==='done' && winSet.has(i)) st = `+${fmt(s.winners.find(w=>w.s===i).amt)}`;
    else if (showAll && p.shown) st = p.hn;
    else if (p.inHand && p.folded) st = '폴드';
    else if (p.allin && p.inHand) st = '올인';
    else if (!p.inHand && p.chips===0) st = view==='local' ? '탈락' : '칩 없음';
    else if (p.away) st = '연결 끊김';
    else if (p.sitOut) st = '자리 비움';
    else if (!p.inHand && s.stage!=='idle' && s.stage!=='done') st = '다음 핸드부터';
    const badge = s.stage!=='idle' && i===s.dealer ? '<span class="badge">D</span>' : '';
    const timer = acting && view==='online' ? `<div class="timer"><i data-deadline="${s.turnDeadline}"></i></div>` : '';
    const bub = view==='online' && ui.bubbles[p.id] && ui.bubbles[p.id].until > now ? `<div class="bubble" data-bub="${esc(p.id)}"></div>` : '';
    seatsHTML += `<div class="${cls}" style="left:${x}%;top:${y}%">${bub}
      ${isMe ? '' : `<div class="hole">${hole}</div>`}
      <div class="plate">${badge}<span class="nm" data-nm="${i}"></span><span class="ch num">${p.chips>0?chipOne(chipParts(p.chips)[0][0]):""}${fmt(p.chips)}</span>${st?`<span class="st">${esc(st)}</span>`:''}</div>${timer}</div>`;
    if (p.bet>0){ const [bx, by] = betPos(x, y, N>=7); chips += `<div class="betchip" data-x="${x}" data-y="${y}" style="left:${bx}%;top:${by}%">${chipStack(p.bet,{cols:2,maxPer:5})}<span class="amt num">${fmt(p.bet)}</span></div>`; }
  }
  const boardHTML = Array.from({length:5},(_,k)=>cardHTML(s.board[k], {animate:true, key:s.handNo+':', hl: showAll && winCards.has(s.board[k])})).join('');
  let result = '';
  if (s.stage==='done' && s.winners.length){
    result = s.winners.map(w=>`<span data-nm="${w.s}"></span> ${s.uncontested ? '승리' : '· ' + esc(w.h)}`).join(' / ');
  }
  const pot = s.stage==='done' ? s.winners.reduce((a,w)=>a+w.amt,0) : potSize(s);

  app.innerHTML = `${head}${statusLine}
  <div class="table${N>=7?' dense':''}${isWide()?' wide':''}">
    <div class="felt"></div>
    <div class="center">
      <span class="stage">${STAGE_KO[s.stage]||''}${s.handNo?` · #${s.handNo}`:''}</span>
      <div class="board">${boardHTML}</div>
      ${pot? `<span class="pot">${chipStack(pot,{cols:4,maxPer:7})}<span class="amt">팟 <b class="num">${fmt(pot)}</b></span></span>` : ''}
      <span class="result">${result}</span>
    </div>
    ${chips}${seatsHTML}
  </div>
  ${renderDock(s, myIdx, now)}
  <ul class="log">${s.log.slice(-8).reverse().map(e=>`<li class="${e.i<0?'sys':''}">${e.i>=0?`<b data-lid="${esc(e.id)}" data-li="${e.i}" data-ln="${esc(e.n||'')}"></b> `:''}${esc(e.m)}</li>`).join('')}</ul>`;

  app.querySelectorAll('[data-nm]').forEach(el=>{ el.textContent = nameOf(s, +el.dataset.nm); });
  app.querySelectorAll('[data-li]').forEach(el=>{ el.textContent = logName(s, {i:+el.dataset.li, id:el.dataset.lid, n:el.dataset.ln}); });
  placeBets();
  app.querySelectorAll('[data-bub]').forEach(el=>{ const b = ui.bubbles[el.dataset.bub]; if (b) el.textContent = b.text; });
  const slider = document.getElementById('raise-range');
  if (slider) slider.addEventListener('input', e=>{ ui.raiseTo = +e.target.value; const b=document.getElementById('raise-go'); if (b) b.textContent = raiseLabel(s, myIdx, ui.raiseTo); const v=document.getElementById('raise-val'); if (v) v.textContent = fmt(ui.raiseTo); });
  tickTimers();
  // 이름 입력 중 화면이 갱신돼도 입력이 끊기지 않게
  if (ui.renameOpen && ui.renameFocus){ const r = document.getElementById('rename-in'); if (r){ r.focus(); const n = r.value.length; try { r.setSelectionRange(n, n); } catch(_){} } }
}

function raiseLabel(s, i, to){ const p=s.seats[i]; if (to >= p.bet+p.chips) return `올인 ${fmt(to)}`; return `${s.currentBet===0?'베팅':'레이즈'} ${fmt(to)}`; }

function inviteBox(s){
  // 게임이 시작되면 숨김 (위쪽 ‘초대 링크’ 버튼은 계속 사용 가능)
  if (view!=='online' || net.role!=='host' || !net.room || !net.mq || !net.mq.connected || s.stage!=='idle') return '';
  return `<div class="tablecode">초대 링크 <span class="num" id="invite-url" style="font-size:12px;letter-spacing:0;word-break:break-all;min-width:0">${esc(inviteLink())}</span><button class="ghost" data-a="invite">보내기</button></div>`;
}

function renderDock(s, mi, now){
  if (mi<0){
    const full = s.seats.every(Boolean);
    return `<div class="dock"><p class="status">${full ? '자리가 다 찼어요. 관전 중이에요.' : '빈 자리를 눌러 앉으면 다음 핸드부터 참여해요.'}</p></div>`;
  }
  const p = s.seats[mi];
  const inPlay = p.inHand && !p.folded;
  const b = inPlay && s.board.length>=3 ? best(p.cards.concat(s.board)) : null;
  let handTxt = '';
  if (p.inHand && p.cards.length){
    if (b) handTxt = handName(b);
    else if (p.cards[0][0]===p.cards[1][0]) handTxt = '포켓 페어';
    else handTxt = p.cards[0][1]===p.cards[1][1] ? '수딧' : '오프수트';
    if (p.folded) handTxt = '폴드함';
  }
  const holes = p.inHand && p.cards.length ? p.cards.map(c=>cardHTML(c,{animate:true,key:s.handNo+'m', dim:p.folded})).join('') : cardHTML(null)+cardHTML(null);
  const mine = `<div class="mine"><div class="hole">${holes}</div><div class="info"><span class="hand">${esc(handTxt || (s.stage==='idle'?'대기 중':'이번 핸드 관전'))}</span><span class="sub">칩 <b class="num">${fmt(p.chips)}</b>${p.bet?` · 이번 라운드 베팅 <span class="num">${fmt(p.bet)}</span>`:''}</span></div></div>`;

  let controls = '';
  if (BETTING.has(s.stage) && s.toAct===mi){
    const L = legal(s, mi);
    const key = `${s.handNo}-${s.stage}-${s.currentBet}-${p.bet}`;
    if (ui.raiseKey!==key){ ui.raiseKey=key; ui.raiseOpen=false; ui.raiseTo=L.minTo; }
    ui.raiseTo = Math.max(L.minTo, Math.min(ui.raiseTo, L.maxTo));
    const callTxt = L.canCheck ? '체크' : (L.callAmt>=p.chips ? `올인 ${fmt(L.callAmt)}` : `콜 ${fmt(L.callAmt)}`);
    controls = `<div class="actions">
      <button class="act fold" data-a="fold">폴드</button>
      <button class="act call" data-a="${L.canCheck?'check':'call'}">${callTxt}</button>
      <button class="act raise" data-a="raise-open" ${L.canRaise?'':'disabled'}>${s.currentBet===0?'베팅':'레이즈'}</button>
    </div>`;
    if (ui.raiseOpen && L.canRaise){
      const potNow = potSize(s);
      const half = s.currentBet + Math.round((potNow+L.callAmt)/2/10)*10;
      const full = s.currentBet + Math.round((potNow+L.callAmt)/10)*10;
      const step = L.maxTo - L.minTo >= 10 ? 10 : 1;
      controls += `<div class="raisebox">
        <div class="row" style="justify-content:space-between"><span>금액</span><b class="num" id="raise-val">${fmt(ui.raiseTo)}</b></div>
        <input id="raise-range" type="range" min="${L.minTo}" max="${L.maxTo}" step="${step}" value="${ui.raiseTo}" aria-label="레이즈 금액">
        <div class="presets">
          <button data-a="preset" data-v="${L.minTo}">최소</button>
          <button data-a="preset" data-v="${half}">½ 팟</button>
          <button data-a="preset" data-v="${full}">팟</button>
          <button data-a="preset" data-v="${L.maxTo}">올인</button>
        </div>
        <button class="primary" id="raise-go" data-a="raise-go">${raiseLabel(s, mi, ui.raiseTo)}</button>
      </div>`;
    }
  } else if (BETTING.has(s.stage)){
    controls = `<p class="status"><b data-nm="${s.toAct}"></b> 차례${view==='online'?` · <span data-count="${s.turnDeadline}"></span>`:'…'}</p>`;
  } else if (s.stage==='done'){
    const over = view==='local' && localGameOver(s);
    if (over) controls = over;
    else if (view==='local') controls = `<button class="primary" data-a="next-local">다음 핸드</button>`;
    else controls = `<p class="status">다음 핸드 <span data-count="${s.nextHandAt}"></span></p>`;
  } else if (s.stage==='idle'){
    const ready = idxs(s, q=>!q.sitOut && !q.away && q.chips>0).length;
    controls = view==='online'
      ? (ready>=2 ? `<button class="primary" data-a="start-online">게임 시작 (${ready}명)</button>` : `<p class="status">2명 이상 앉으면 시작할 수 있어요. 친구에게 초대 링크를 보내주세요.</p>`)
      : '';
  }
  let extra = '';
  if (view==='online'){
    const btns = [];
    if (p.sitOut) btns.push(`<button class="ghost" data-a="sitback">자리로 돌아오기</button>`);
    if (p.chips===0 && (!p.inHand || s.stage==='done' || s.stage==='idle')) btns.push(`<button class="ghost" data-a="rebuy">${fmt(s.startChips||START_CHIPS)}칩 다시 받기</button>`);
    btns.push(`<button class="ghost" data-a="rename-open">이름 변경</button>`);
    if (net.role!=='host') btns.push(`<button class="ghost" data-a="stand">자리에서 일어나기</button>`);
    extra = `<div class="row">${btns.join('')}</div>`;
    if (net.role==='host'){
      const N = s.seats.length, seated = s.seats.filter(Boolean).length, busy = BETTING.has(s.stage);
      extra += `<div class="seatsize"><span>최대 인원</span>
        <div class="stepper"><button data-a="seats-" aria-label="인원 줄이기" ${busy||N<=Math.max(MIN_SEATS,seated)?'disabled':''}>−</button><span class="num">${N}</span><span>명</span><button data-a="seats+" aria-label="인원 늘리기" ${busy||N>=MAX_SEATS?'disabled':''}>+</button></div>
        <span class="note">${busy ? '이번 핸드가 끝나면 바꿀 수 있어요' : `지금 ${seated}명 앉아 있어요`}</span></div>`;
    }
    if (ui.renameOpen){
      extra += `<form class="row" id="rename-form" novalidate>
        <input id="rename-in" class="code-in" style="letter-spacing:0;text-transform:none;font-family:var(--f-body)" maxlength="10" value="${esc(ui.renameDraft ?? (p.name || me.name))}" aria-label="새 이름" enterkeyhint="done">
        <button class="primary" type="submit">저장</button></form>`;
    }
  }
  return `<div class="dock">${mine}${controls}${extra}${inviteBox(s)}</div>`;
}

function localGameOver(s){
  const mine = s.seats[0];
  const botsLeft = idxs(s,(p,i)=>i>0 && p.chips>0).length;
  if (mine.chips===0) return `<div class="over"><h3>칩을 모두 잃었어요</h3><p class="note">${s.handNo}핸드를 버텼어요.</p><button class="primary" data-a="start-local">새 게임</button></div>`;
  if (botsLeft===0) return `<div class="over"><h3>우승!</h3><p class="note">${s.handNo}핸드 만에 모든 칩을 가져왔어요.</p><button class="primary" data-a="start-local">새 게임</button></div>`;
  return '';
}

function tickTimers(){
  const now = Date.now();
  app.querySelectorAll('[data-deadline]').forEach(el=>{ const left = Math.max(0, +el.dataset.deadline - now); el.style.width = (left/TURN_MS*100)+'%'; });
  app.querySelectorAll('[data-count]').forEach(el=>{ const left = Math.max(0, Math.ceil((+el.dataset.count - now)/1000)); el.textContent = `${left}초`; });
}
